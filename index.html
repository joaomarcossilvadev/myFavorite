<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmes Populares</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Filmes Populares</h1>

    <div class="form-control">
      <input type="text" id="js-search" placeholder="Digite algum filme para pesquisar...">
      <button type="button" aria-label="Pesquisar">
        <img src="images/search-icon.svg" alt="">
      </button>
    </div>

    <div class="favorite-container">
      <input type="checkbox" id="show-favorites">
      <label for="show-favorites">Mostrar meus filmes favoritos apenas</label>
    </div>
  </header>

  <main id="movies-container"></main>

  <script type="module"  src="scripts/main.js"></script>
</body>
</html>
